# Production stack: Postgres + Redis + PgBouncer + backend (API) + worker + frontend.
# This file already defaults to ENVIRONMENT=production and requires real
# secrets/Postgres (see .env.example). For the full deploy with nginx + TLS,
# run with the prod overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-easm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-easm}
      - POSTGRES_DB=${POSTGRES_DB:-easm}
    volumes:
      - db-data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=2GB
        -c work_mem=32MB
        -c maintenance_work_mem=256MB
        -c max_connections=500
        -c max_worker_processes=8
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c max_parallel_maintenance_workers=4
        -c wal_buffers=64MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c max_wal_size=4GB
        -c min_wal_size=1GB
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_connections=on
        -c log_disconnections=on
        -c shared_preload_libraries='pg_stat_statements'
        -c track_activity_query_size=2048
        -c log_lock_waits=on
        -c deadlock_timeout=5s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-easm}:${POSTGRES_PASSWORD:-easm}@db:5432/${POSTGRES_DB:-easm}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=50
      - MAX_CLIENT_CONN=1000
      - MAX_DB_CONNECTIONS=100
      - RESERVE_POOL_SIZE=10
      - RESERVE_POOL_TIMEOUT=3
      - SERVER_IDLE_TIMEOUT=300
      - CLIENT_IDLE_TIMEOUT=0
      - QUERY_WAIT_TIMEOUT=30
      - LOG_CONNECTIONS=1
      - LOG_DISCONNECTIONS=1
      - LOG_POOLER_ERRORS=1
      - STATS_PERIOD=60
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U ${POSTGRES_USER:-easm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "/app/entrypoint.sh", "api"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-easm}:${POSTGRES_PASSWORD:-easm}@pgbouncer:6432/${POSTGRES_DB:-easm}
      - DB_POOL_SIZE=30
      - DB_MAX_OVERFLOW=50
      - DB_POOL_TIMEOUT=15
      - DB_POOL_RECYCLE=900
      - DB_POOL_PRE_PING=true
      - DB_STATEMENT_CACHE_SIZE=1000
      - REDIS_URL=redis://redis:6379/0
      # Scans go to the durable queue and run in the scan-worker service.
      - SCAN_EXECUTION_MODE=queue
      - RUN_EMBEDDED_WORKER=false
      - SCOPE_ENFORCEMENT=${SCOPE_ENFORCEMENT:-registered}
      - DEBUG=false
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-log}
    volumes:
      - backend-reports:/app/reports
      - backend-uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; import sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Runs queued scans, scheduled scans and periodic jobs (SSL expiry, weekly
  # digest, CVE sync). Scale with: docker compose up -d --scale scan-worker=3
  scan-worker:
    build:
      context: .
      dockerfile: scan-engine/Dockerfile.scan
    command: ["python", "-m", "app.workers.scan_worker"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-easm}:${POSTGRES_PASSWORD:-easm}@pgbouncer:6432/${POSTGRES_DB:-easm}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=10
      - REDIS_URL=redis://redis:6379/0
      - SCAN_EXECUTION_MODE=queue
      - SCOPE_ENFORCEMENT=${SCOPE_ENFORCEMENT:-registered}
      - SCAN_WORKER_CONCURRENCY=${SCAN_WORKER_CONCURRENCY:-3}
      - SCAN_MAX_RUNNING_PER_ORG=${SCAN_MAX_RUNNING_PER_ORG:-2}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-log}
    volumes:
      - backend-reports:/app/reports
      - backend-uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-easm2024}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-easm2024}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-EasmAdmin123!}
      - plugins.security.ssl.http.enabled=false
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.name=easm-opensearch
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  db-data:
  redis-data:
  backend-reports:
  backend-uploads:
  neo4j-data:
  opensearch-data:
