<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background network nodes -->
  <circle cx="30" cy="40" r="2.5" fill="#3B82F6" opacity="0.4"/>
  <circle cx="170" cy="35" r="2" fill="#06B6D4" opacity="0.3"/>
  <circle cx="25" cy="120" r="2" fill="#3B82F6" opacity="0.25"/>
  <circle cx="175" cy="130" r="2.5" fill="#06B6D4" opacity="0.35"/>
  <circle cx="45" cy="170" r="1.5" fill="#3B82F6" opacity="0.2"/>
  <circle cx="155" cy="175" r="2" fill="#06B6D4" opacity="0.25"/>
  <circle cx="100" cy="20" r="1.5" fill="#3B82F6" opacity="0.3"/>
  <circle cx="15" cy="80" r="1.5" fill="#06B6D4" opacity="0.2"/>
  <circle cx="185" cy="85" r="1.5" fill="#3B82F6" opacity="0.2"/>

  <!-- Network connection lines -->
  <line x1="30" y1="40" x2="100" y2="55" stroke="#3B82F6" stroke-width="0.5" opacity="0.15"/>
  <line x1="170" y1="35" x2="100" y2="55" stroke="#06B6D4" stroke-width="0.5" opacity="0.15"/>
  <line x1="25" y1="120" x2="65" y2="100" stroke="#3B82F6" stroke-width="0.5" opacity="0.12"/>
  <line x1="175" y1="130" x2="135" y2="100" stroke="#06B6D4" stroke-width="0.5" opacity="0.12"/>
  <line x1="45" y1="170" x2="80" y2="140" stroke="#3B82F6" stroke-width="0.4" opacity="0.1"/>
  <line x1="155" y1="175" x2="120" y2="140" stroke="#06B6D4" stroke-width="0.4" opacity="0.1"/>
  <line x1="100" y1="20" x2="100" y2="55" stroke="#3B82F6" stroke-width="0.4" opacity="0.12"/>
  <line x1="15" y1="80" x2="65" y2="100" stroke="#06B6D4" stroke-width="0.3" opacity="0.1"/>
  <line x1="185" y1="85" x2="135" y2="100" stroke="#3B82F6" stroke-width="0.3" opacity="0.1"/>

  <!-- Outer glow shield shape -->
  <path d="M100 30 L145 55 L145 110 Q145 145 100 170 Q55 145 55 110 L55 55 Z"
        fill="url(#glowGrad)" opacity="0.5"/>

  <!-- Shield body -->
  <path d="M100 38 L140 58 L140 108 Q140 138 100 160 Q60 138 60 108 L60 58 Z"
        fill="#111827" stroke="url(#shieldGrad)" stroke-width="2"/>

  <!-- Inner shield accent -->
  <path d="M100 48 L132 64 L132 104 Q132 130 100 148 Q68 130 68 104 L68 64 Z"
        fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3"/>

  <!-- Crosshair / Target lines -->
  <line x1="100" y1="70" x2="100" y2="85" stroke="#EF4444" stroke-width="1.5" opacity="0.8" filter="url(#redGlow)"/>
  <line x1="100" y1="115" x2="100" y2="130" stroke="#EF4444" stroke-width="1.5" opacity="0.8" filter="url(#redGlow)"/>
  <line x1="80" y1="100" x2="95" y2="100" stroke="#EF4444" stroke-width="1.5" opacity="0.8" filter="url(#redGlow)"/>
  <line x1="105" y1="100" x2="120" y2="100" stroke="#EF4444" stroke-width="1.5" opacity="0.8" filter="url(#redGlow)"/>

  <!-- Center target circle -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.7" filter="url(#redGlow)"/>
  <circle cx="100" cy="100" r="6" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="2" fill="#EF4444" opacity="0.9" filter="url(#redGlow)"/>

  <!-- Small data nodes around shield -->
  <circle cx="75" cy="75" r="2" fill="#3B82F6" opacity="0.6" filter="url(#glow)"/>
  <circle cx="125" cy="75" r="2" fill="#06B6D4" opacity="0.6" filter="url(#glow)"/>
  <circle cx="75" cy="125" r="2" fill="#06B6D4" opacity="0.5" filter="url(#glow)"/>
  <circle cx="125" cy="125" r="2" fill="#3B82F6" opacity="0.5" filter="url(#glow)"/>

  <!-- Connection lines from nodes to center -->
  <line x1="75" y1="75" x2="94" y2="94" stroke="#3B82F6" stroke-width="0.6" opacity="0.3"/>
  <line x1="125" y1="75" x2="106" y2="94" stroke="#06B6D4" stroke-width="0.6" opacity="0.3"/>
  <line x1="75" y1="125" x2="94" y2="106" stroke="#06B6D4" stroke-width="0.6" opacity="0.25"/>
  <line x1="125" y1="125" x2="106" y2="106" stroke="#3B82F6" stroke-width="0.6" opacity="0.25"/>
</svg>
